apiVersion: 1

datasources:
  - name: Pirx SQLite
    uid: pirx-sqlite
    type: frser-sqlite-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      # Consistent read-only snapshot; exporter merges WAL pages using SQLite backup.
      path: /var/lib/pirx/pirx.sqlite

  - name: Pirx GPU
    uid: pirx-gpu
    type: frser-sqlite-datasource
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      # Exported every 30 seconds from the GPU sampler database.
      path: /var/lib/pirx/gpu.sqlite
