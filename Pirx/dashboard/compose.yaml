name: pirx-dashboard

services:
  exporter:
    image: python:3.14-slim
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python3, /app/snapshot.py, --source, /source, --destination, /snapshots, --watch]
    volumes:
      - ${HOME}/.local/share/pirx:/source:ro
      - ${HOME}/.local/share/pirx-dashboard-export:/snapshots
      - ./snapshot.py:/app/snapshot.py:ro

  grafana:
    image: grafana/grafana:13.0.8
    # Only dedicated reporting snapshots are visible, never the live runtime directory.
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: frser-sqlite-datasource@4.0.6
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?start the dashboard with ./up.sh}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_LOG_MODE: console
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pirx/pirx-models.json
    volumes:
      - ${HOME}/.local/share/pirx-dashboard-export:/var/lib/pirx:ro
      - ${HOME}/.local/share/pirx-grafana:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/grafana/dashboards/pirx:ro
