[project]
name = "pirx-mcp"
version = "0.1.0"
description = "Pirx MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "google-api-python-client>=2.198.0",
  "google-auth>=2.56.3",
  "google-auth-oauthlib>=1.4.0",
  "mcp[cli]>=1.28.1",
  "ollama>=0.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pirx_mcp"]
